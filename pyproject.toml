[project]
name = "claude-blog-follower"
version = "0.2.0"
description = "Track and analyze Anthropic's blog posts about Claude"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "jinja2>=3.1.0",
    "markdown>=3.5.0",
    "rich>=13.9.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
claude-blog = "claude_blog_follower.cli:main"
